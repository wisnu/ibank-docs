site_name: iBank Documentation
site_description: Dokumentasi aplikasi core banking iBank
site_url: https://wisnu.github.io/ibank-docs/

theme:
  name: material
  custom_dir: overrides
  language: id
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

nav:
  - Home: index.md

  - Public:
      - Home: public/index.md

  - Private:
      - Home: private/index.md

  # URL BARU (struktur rapi)
  - iBank:
      - General Ledger:
          - TSD Architecture: ihsansolusi/ibank/GL/TSD Architecture.md
          - Chart of Account:
              - PRD - Chart of Account: ihsansolusi/ibank/GL/chart-of-account/PRD_COA_Main.md
              - FSD - Chart of Account: ihsansolusi/ibank/GL/chart-of-account/FSD_COA_Main.md
              - COA List:
                  - FSD - COA List: ihsansolusi/ibank/GL/chart-of-account/list/FSD_COA_List.md
              - COA Create:
                  - FSD - COA Create: ihsansolusi/ibank/GL/chart-of-account/create/FSD_COA_Create.md
              - COA Edit:
                  - FSD - COA Edit: ihsansolusi/ibank/GL/chart-of-account/edit/FSD_COA_Edit.md
                  - TSD - COA Edit: ihsansolusi/ibank/GL/chart-of-account/edit/TSD_COA_Edit.md
                  - TEST - COA Edit: ihsansolusi/ibank/GL/chart-of-account/edit/TEST_COA_Edit.md
                  - Referensi: ihsansolusi/ibank/GL/chart-of-account/edit/referensi.md
          - Neraca / Laba Rugi:
              - FSD - Neraca / Laba Rugi: ihsansolusi/ibank/GL/balance-sheet/FSD_balance-sheet_report.md
              - TSD - Neraca / Laba Rugi: ihsansolusi/ibank/GL/balance-sheet/TSD_balance-sheet_report.md
          - Trial Balance:
              - FSD - Trial Balance: ihsansolusi/ibank/GL/trial-balance/FSD_trial-balance_report.md
              - TSD - Trial Balance: ihsansolusi/ibank/GL/trial-balance/TSD_trial-balance_report.md
          - Buku Besar:
              - Coming Soon: ihsansolusi/ibank/GL/ledger/placeholder.md

  - Clients:
      - BJBS:
          - Fingerscan:
              - FSD - Fingerscan Biometrik: clients/bjbs/Fingerscan/FSD_Fingerscan_Biometrik.md
          - Enhance Dormant:
              - Screenshot: clients/bjbs/enhance_dormant/dormant_screenshot.md
              - DDL/DML Update (Postgres): clients/bjbs/enhance_dormant/executed_update_pg.md
      - BCAS:
          - Enhance Dormant:
              - FSD - Enhance Dormant: clients/bcas/enhance_dormant/dormant_fsd.md
              - Design Plan: clients/bcas/enhance_dormant/dormant_design_plan.md
              - Use Case: clients/bcas/enhance_dormant/dormant_use_case.md
              - Screenshot: clients/bcas/enhance_dormant/dormant_screenshot.md
              - Presentasi - Tanggal Aktivitas: clients/bcas/enhance_dormant/dormant_presentasi.md
          - Saku Valas:
              - FSD - Saku Valas: clients/bcas/saku_valas/fsd_sakuvalas.md

  # BACKWARD COMPATIBILITY (URL LAMA)
  - BJBS (Legacy):
      - Fingerscan:
          - FSD - Fingerscan Biometrik: clients/bjbs/Fingerscan/FSD_Fingerscan_Biometrik.md
      - Enhance Dormant:
          - Screenshot: clients/bjbs/enhance_dormant/dormant_screenshot.md
          - DDL/DML Update (Postgres): clients/bjbs/enhance_dormant/executed_update_pg.md
  - BCAS (Legacy):
      - Enhance Dormant:
          - FSD - Enhance Dormant: clients/bcas/enhance_dormant/dormant_fsd.md
          - Design Plan: clients/bcas/enhance_dormant/dormant_design_plan.md
          - Use Case: clients/bcas/enhance_dormant/dormant_use_case.md
          - Screenshot: clients/bcas/enhance_dormant/dormant_screenshot.md
          - Presentasi - Tanggal Aktivitas: clients/bcas/enhance_dormant/dormant_presentasi.md
      - Saku Valas:
          - FSD - Saku Valas: clients/bcas/saku_valas/fsd_sakuvalas.md

