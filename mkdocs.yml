        'bjbs/enhance_dormant/executed_update_pg.md': 'clients/bjbs/enhance_dormant/executed_update_pg.md'
        'bcas/enhance_dormant/dormant_fsd.md': 'clients/bcas/enhance_dormant/dormant_fsd.md'
        'bcas/enhance_dormant/dormant_design_plan.md': 'clients/bcas/enhance_dormant/dormant_design_plan.md'
        'bcas/enhance_dormant/dormant_use_case.md': 'clients/bcas/enhance_dormant/dormant_use_case.md'
        'bcas/enhance_dormant/dormant_screenshot.md': 'clients/bcas/enhance_dormant/dormant_screenshot.md'
        'bcas/enhance_dormant/dormant_presentasi.md': 'clients/bcas/enhance_dormant/dormant_presentasi.md'
        'bcas/saku_valas/fsd_sakuvalas.md': 'clients/bcas/saku_valas/fsd_sakuvalas.md'
        'ibank/GL/TSD Architecture.md': 'ihsansolusi/ibank/GL/TSD Architecture.md'
        'ibank/GL/chart-of-account/PRD_COA_Main.md': 'ihsansolusi/ibank/GL/chart-of-account/PRD_COA_Main.md'
        'ibank/GL/chart-of-account/FSD_COA_Main.md': 'ihsansolusi/ibank/GL/chart-of-account/FSD_COA_Main.md'
        'ibank/GL/chart-of-account/list/FSD_COA_List.md': 'ihsansolusi/ibank/GL/chart-of-account/list/FSD_COA_List.md'
        'ibank/GL/chart-of-account/create/FSD_COA_Create.md': 'ihsansolusi/ibank/GL/chart-of-account/create/FSD_COA_Create.md'
        'ibank/GL/chart-of-account/edit/FSD_COA_Edit.md': 'ihsansolusi/ibank/GL/chart-of-account/edit/FSD_COA_Edit.md'
        'ibank/GL/chart-of-account/edit/TSD_COA_Edit.md': 'ihsansolusi/ibank/GL/chart-of-account/edit/TSD_COA_Edit.md'
        'ibank/GL/chart-of-account/edit/referensi.md': 'ihsansolusi/ibank/GL/chart-of-account/edit/referensi.md'
